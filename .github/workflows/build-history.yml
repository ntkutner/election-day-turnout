name: build-history
on:
  push:
    paths: ["scripts/build_history.py", ".github/workflows/build-history.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python scripts/build_history.py
      - run: |
          git config user.name "turnout-bot"; git config user.email "turnout-bot@users.noreply.github.com"
          git add docs/data/history_2022_2024.json; git commit -m "data: 2022/2024 county turnout [skip ci]" || exit 0
          for i in 1 2 3 4; do git pull -q --rebase -X theirs && git push -q && break; sleep 5; done
