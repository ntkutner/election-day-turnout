name: build-harris-precincts
on:
  push:
    paths: ["scripts/build_harris_precincts.py", "scripts/harris_senate_2024.csv", ".github/workflows/build-precincts.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pyshp shapely pyproj
      - run: python scripts/build_harris_precincts.py
      - name: Commit
        run: |
          git config user.name "turnout-bot"
          git config user.email "turnout-bot@users.noreply.github.com"
          git add docs/data/harris_precincts.json
          git commit -m "data: Harris 2024 precinct map [skip ci]" || exit 0
          for i in 1 2 3 4; do git pull -q --rebase -X theirs && git push -q && break; sleep 5; done
